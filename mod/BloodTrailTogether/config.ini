; BloodTrail Together settings. The multiplayer window (F9 in game) changes these for you.

[Player]
Name=Player

[Relay]
; Public Unity project id of the shared BloodTrail Together Relay project.
; This is NOT a secret: it only identifies the project. Release builds fill it in.
ProjectId=
Environment=production
; Leave empty to let Unity choose the closest region.
Region=

[Sync]
PoseSendHz=30
InterpDelayMs=100
MaxExtrapolateMs=150

[Audio]
; Sounds that happen within this distance (cm) of your head or hands are shared.
ShareRadiusCm=180

[Gameplay]
; 1 = both players see the host's NPCs (enemies are shared). 0 = each player has their own NPCs.
NpcSync=1

[Updates]
GitHubRepo=
Check=1
