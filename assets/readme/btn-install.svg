<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="0 0 220 56">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3030"/>
      <stop offset="1" stop-color="#1c1616"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="6" y="6" width="208" height="44" rx="12"/></clipPath>
  </defs>
  <rect x="3" y="3" width="214" height="50" rx="15" fill="none" stroke="#e0504a" stroke-width="3">
    <animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="6" y="6" width="208" height="44" rx="12" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <rect x="-80" y="6" width="70" height="44" fill="url(#s)" transform="skewX(-20)">
      <animate attributeName="x" values="-120;300" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="110.0" y="35" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="17" fill="#fff" letter-spacing="1.5">📖  INSTALL GUIDE</text>
</svg>
