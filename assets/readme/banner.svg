<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0b0b"/>
      <stop offset="1" stop-color="#070606"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#a01010" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.35;0.6;0.35" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a01010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2ece6"/>
      <stop offset="0.45" stop-color="#f2ece6"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2ece6"/>
      <stop offset="1" stop-color="#f2ece6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e02a2a"/>
      <stop offset="0.5" stop-color="#ff5a4a"/>
      <stop offset="1" stop-color="#b81818"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e02020" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff3a30" stop-opacity="1"/>
      <stop offset="1" stop-color="#e02020" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect width="900" height="220" rx="18" fill="url(#glow)"/>
  <!-- blood drips from the top edge -->
  <g fill="#9c0d0d">
    <path d="M120 0 h14 v18 q-7 14 -14 0 z">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.9;1 1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M610 0 h10 v12 q-5 10 -10 0 z">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 2.4;1 1" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <path d="M790 0 h12 v15 q-6 12 -12 0 z">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 2.1;1 1" dur="5.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="127" cy="40" r="4">
      <animate attributeName="cy" values="30;220" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="615" cy="30" r="3">
      <animate attributeName="cy" values="26;220" dur="7.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="7.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="450" y="104" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif" font-weight="900" font-size="62" letter-spacing="4">
    <tspan fill="url(#shine)">BLOODTRAIL</tspan><tspan fill="url(#red)" dx="18">TOGETHER</tspan>
  </text>
  <rect x="110" y="124" width="680" height="3" fill="url(#sweep)">
    <animate attributeName="x" values="-500;900" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#c9bcb6">
    Unofficial 2-player VR co-op &amp; PvP mod for BloodTrail
  </text>
  <text x="450" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8c7d78" letter-spacing="2">
    SERVER LIST · SYNCED GORE · SMARTER NPCS · CHARACTER CUSTOMISATION
    <animate attributeName="fill" values="#8c7d78;#d96a60;#8c7d78" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
